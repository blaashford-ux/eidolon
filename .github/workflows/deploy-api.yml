name: Deploy API Worker

on:
  push:
    branches:
      - main
    paths:
      - apps/api/**
      - packages/db/bootstrap.sql
      - package.json
      - package-lock.json
  workflow_dispatch:

concurrency:
  group: deploy-api-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check API
        run: npm run check --workspace @eidolon/api

      - name: Verify Cloudflare auth and Wrangler
        working-directory: apps/api
        run: |
          npx wrangler --version
          npx wrangler whoami

      - name: Deploy Worker
        working-directory: apps/api
        run: npx wrangler deploy --config wrangler.toml

      - name: Bootstrap D1 schema
        working-directory: apps/api
        run: npx wrangler d1 execute eidolon-db --remote --file ../../packages/db/bootstrap.sql --config wrangler.toml
